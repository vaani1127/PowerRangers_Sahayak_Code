<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Class Teacher - Sahayak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/scripts/theme.js"></script>
</head>
<body class="app-page">
  <script src="/scripts/loader.js"></script>

  <div class="app-layout">
    <div id="navbar-placeholder"></div>

    <main class="app-main">
      <div class="page-header">
        <h1>Assign Class Teacher</h1>
        <p>Designate a single teacher as the class in-charge for a section.</p>
      </div>

      <div style="max-width:520px;">
        <form id="assign-form" class="card">
          <div class="form-group">
            <label for="class">Class</label>
            <select id="class" required>
              <option value="">- Select Class -</option>
            </select>
          </div>
          <div class="form-group">
            <label for="section">Section</label>
            <select id="section" required disabled>
              <option value="">- Select Class First -</option>
            </select>
          </div>
          <div class="form-group">
            <label for="teacher">Class Teacher</label>
            <select id="teacher" required>
              <option value="">- Select Teacher -</option>
            </select>
          </div>
          <div class="form-group">
            <label for="year">Academic Year</label>
            <select id="year" required>
              <option value="">- Select Year -</option>
            </select>
          </div>
          <button type="submit" class="btn primary-btn" style="width:100%;">Assign Class Teacher</button>
          <p id="status-message" class="status-message" style="text-align:center;margin-top:12px;"></p>
        </form>
      </div>
    </main>
  </div>

  <script src="../scripts/navbar-admin.js"></script>
  <script src="../scripts/admin-assign-class-teacher.js"></script>
</body>
</html>
