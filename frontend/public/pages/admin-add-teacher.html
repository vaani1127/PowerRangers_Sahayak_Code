<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Teacher - Sahayak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/scripts/theme.js"></script>
</head>
<body class="app-page">
  <script src="/scripts/loader.js"></script>

  <div class="app-layout">
    <div id="navbar-placeholder"></div>

    <main class="app-main">
      <div class="page-header">
        <h1>Add Teacher</h1>
        <p>Register a new teacher manually or bulk-import via CSV file.</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:900px;">

        <!-- Manual entry -->
        <div class="card">
          <h2 style="font-size:0.82rem;font-weight:600;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;">Manual Entry</h2>
          <form id="teacher-form">
            <input type="hidden" id="teacher-id">
            <div class="form-group">
              <label for="teacher-name">Full Name</label>
              <input type="text" id="teacher-name" placeholder="e.g. Priya Sharma" required>
            </div>
            <div class="form-group">
              <label for="teacher-email">Email Address</label>
              <input type="email" id="teacher-email" placeholder="teacher@school.edu" required>
            </div>
            <div class="form-group">
              <label for="teacher-password">Password</label>
              <div class="input-wrap">
                <input type="password" id="teacher-password" placeholder="Set initial password" required>
                <button type="button" class="input-eye-btn" id="pw-eye-btn" aria-label="Toggle password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="btn primary-btn" style="width:100%;">Add / Update Teacher</button>
          </form>
        </div>

        <!-- Right column: CSV + list -->
        <div style="display:flex;flex-direction:column;gap:16px;">
          <div class="card">
            <h2 style="font-size:0.82rem;font-weight:600;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;">Bulk CSV Import</h2>
            <p style="font-size:0.8rem;color:var(--text-3);margin-bottom:14px;">Columns: <code style="background:var(--surface-2);padding:2px 6px;border-radius:3px;">name, email, password</code></p>
            <form id="teacher-csv-form">
              <div class="form-group">
                <label for="teacher-csv">Choose CSV File</label>
                <input type="file" id="teacher-csv" accept=".csv" required>
              </div>
              <button type="button" id="upload-csv-btn" class="btn" style="width:100%;">Upload Teachers CSV</button>
              <p id="csv-upload-status" class="status-message" style="margin-top:10px;text-align:center;"></p>
            </form>
            <div id="csv-upload-summary" class="hidden" style="margin-top:12px;font-size:0.82rem;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:12px;"></div>
          </div>

          <div class="card" style="flex:1;">
            <h2 style="font-size:0.82rem;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;">Registered Teachers</h2>
            <div id="teacher-list" style="max-height:260px;overflow-y:auto;">
              <ul id="teachers" style="margin:0;padding:0;list-style:none;"></ul>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const pwEye = document.getElementById('pw-eye-btn');
    const pwInp = document.getElementById('teacher-password');
    pwEye.addEventListener('click', () => {
      const show = pwInp.type === 'password';
      pwInp.type = show ? 'text' : 'password';
      pwEye.innerHTML = show
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    });
  </script>
  <script src="../scripts/auth-check.js"></script>
  <script src="/scripts/navbar-admin.js"></script>
  <script src="/scripts/admin-add-teacher.js"></script>
</body>
</html>
