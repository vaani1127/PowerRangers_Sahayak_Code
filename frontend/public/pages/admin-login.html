<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Sahayak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">

  <div class="form-container">
    <div class="logo-mark">⬡</div>
    <h2>Admin Login</h2>
    <p class="subtitle">School administration portal</p>

    <div class="demo-creds">
      <strong>Demo Credentials</strong>
      <p>Email: <span>admin1@school.com</span></p>
      <p>Password: <span>securepassword123</span></p>
    </div>

    <form id="admin-login-form" method="post">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="admin@school.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>

    <p id="error-message" class="error-message"></p>
    <a href="/">← Back to Home</a>
  </div>

  <script src="../scripts/admin-login.js"></script>
</body>
</html>
