<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Sahayak</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="content-container">
        <h1>Admin Login</h1>
        
        <div style="background-color: #f0f0f0; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #28a745;">
            <h3 style="margin-top: 0; color: #333;">📋 Demo Credentials</h3>
            <p style="margin: 8px 0;"><strong>Email:</strong> admin1@school.com</p>
            <p style="margin: 8px 0;"><strong>Password:</strong> securepassword123</p>
        </div>
        
        <form id="admin-login-form" class="form-card" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Log In</button>
        </form>
        <p id="error-message" class="error-message"></p>
        <a href="/">Back to Home</a>
    </main>

    <script src="../scripts/admin-login.js"></script>
</body>
</html>
