<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers - Sahayak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/scripts/theme.js"></script>
</head>
<body class="app-page">
  <script src="/scripts/loader.js"></script>

  <div class="app-layout">
    <div id="navbar-placeholder"></div>

    <main class="app-main">
      <div class="page-header">
        <h1>All Teachers</h1>
        <p>View, search and manage registered teachers.</p>
      </div>

      <div class="table-wrap" id="teachers-container">
        <table id="teachers-table" class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Status</th>
              <th>Joined On</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/scripts/navbar-admin.js"></script>
  <script src="../scripts/admin-view-teachers.js"></script>
</body>
</html>
