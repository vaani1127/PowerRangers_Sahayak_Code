<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Submissions — Sahayak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/scripts/theme.js"></script>
</head>
<body class="app-page">
  <script src="/scripts/loader.js"></script>

  <div class="app-layout">
    <div id="navbar-placeholder"></div>

    <main class="app-main">
      <div class="page-header-row">
        <div>
          <h1 id="submission-header">Review Submissions</h1>
          <p>Select a completed chapter to view student submissions.</p>
        </div>
        <a href="teacher-dashboard.html" class="btn secondary-btn">← Dashboard</a>
      </div>

      <div class="section-block">
        <div class="section-heading">Completed Chapters</div>
        <div id="chapter-list-container" class="button-grid">
          <p style="color:var(--text-3);font-size:0.85rem;">Loading chapters…</p>
        </div>
      </div>

      <div id="worksheet-section" class="card hidden" style="margin-top:8px;">
        <h2 id="worksheet-chapter-title" style="font-size:0.95rem;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);">Student Submissions</h2>
        <div id="submission-stats" class="stats-box"></div>
        <div id="student-submission-list" class="list-group"></div>
      </div>
    </main>
  </div>

  <script src="../scripts/auth-check.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script src="../scripts/worksheet-submissions.js"></script>
</body>
</html>
