<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Generator - Sahayak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/scripts/theme.js"></script>
</head>
<body class="app-page">
  <script src="/scripts/loader.js"></script>

  <div class="app-layout">
    <div id="navbar-placeholder"></div>

    <main class="app-main">
      <div class="page-header">
        <h1>AI Content Generator</h1>
        <p>Upload PDF lecture notes and generate summaries, questions, or MCQs instantly.</p>
      </div>

      <div style="max-width:640px;">
        <form id="content-form" class="card">

          <div class="form-group">
            <label for="pdf-upload">Upload PDF Lecture Notes</label>
            <input type="file" id="pdf-upload" accept=".pdf" required>
          </div>

          <div class="form-group">
            <label>What would you like to generate?</label>
            <div class="radio-group">
              <label><input type="radio" name="content-type" value="summary"> Detailed Summary</label>
              <label><input type="radio" name="content-type" value="questions" checked> Subjective Questions (15–20)</label>
              <label><input type="radio" name="content-type" value="mcq"> MCQ with Answer Key (10 questions)</label>
              <label><input type="radio" name="content-type" value="both"> Summary + Questions</label>
            </div>
          </div>

          <div class="form-group" style="max-width:260px;">
            <label for="difficulty">Difficulty Level</label>
            <select id="difficulty" required>
              <option value="beginner">Beginner</option>
              <option value="intermediate" selected>Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>

          <button type="submit" id="generate-btn" class="btn primary-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
            Generate Content
          </button>
          <p id="status-message" class="status-message" style="text-align:left;margin-top:12px;"></p>
        </form>

        <section id="result-section" class="result-box hidden" style="margin-top:20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);">
            <h2 style="margin:0;font-size:0.95rem;">Generated Content</h2>
            <button id="download-pdf-btn" class="btn secondary-btn" style="font-size:0.78rem;padding:6px 14px;">Download PDF</button>
          </div>
          <div id="generated-content" class="content-output"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../scripts/auth-check.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script type="module" src="../scripts/content-generation.js"></script>
</body>
</html>
