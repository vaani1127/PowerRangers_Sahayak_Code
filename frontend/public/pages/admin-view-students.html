<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Students - Sahayak</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <main class="content-container">
      <h1> Generate Student Report card</h1>

      <section class="admin-section">
        <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px;">
          <div class="form-group" style="margin:0; flex:1; min-width:160px;">
            <label for="class-filter">Class</label>
            <select id="class-filter">
              <option value="">All Classes</option>
            </select>
          </div>
          <div class="form-group" style="margin:0; flex:1; min-width:160px;">
            <label for="section-filter">Section</label>
            <select id="section-filter" disabled>
              <option value="">All Sections</option>
            </select>
          </div>
          <button id="filter-btn" class="btn" style="height:42px; align-self:flex-end;">Filter</button>
          <!--  New button -->
          <!-- Commented out: download ZIP button (kept for future use)
          <button id="download-class-reports-btn" class="btn btn-secondary">📦 Download Class Report ZIP</button>
          -->
        </div>

        <div id="students-container" class="data-card">
          <h2 class="data-title">All Students</h2>
          <table id="students-table" class="data-table">
            <thead>
              <tr>
                <!-- <th>ID</th> -->
                <th>Name</th>
                <th>Email</th>
                <th>Roll No</th>
                <th>Class</th>
                <th>Section</th>
                <th>Parent Contact</th>
                <th>Parent Email</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="../scripts/navbar-admin.js"></script>
    <script src="../scripts/admin-view-students.js"></script>
  </body>
</html>
