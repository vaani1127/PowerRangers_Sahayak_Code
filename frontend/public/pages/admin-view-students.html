<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Report Cards - Sahayak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/scripts/theme.js"></script>
</head>
<body class="app-page">
  <script src="/scripts/loader.js"></script>

  <div class="app-layout">
    <div id="navbar-placeholder"></div>

    <main class="app-main">
      <div class="page-header">
        <h1>Student Report Cards</h1>
        <p>Filter by class and section, then generate individual report cards.</p>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
          <div class="form-group" style="margin:0;flex:1;min-width:150px;">
            <label for="class-filter">Class</label>
            <select id="class-filter">
              <option value="">All Classes</option>
            </select>
          </div>
          <div class="form-group" style="margin:0;flex:1;min-width:150px;">
            <label for="section-filter">Section</label>
            <select id="section-filter" disabled>
              <option value="">All Sections</option>
            </select>
          </div>
          <button id="filter-btn" class="btn" style="height:38px;align-self:flex-end;">Filter</button>
        </div>
      </div>

      <div class="table-wrap" id="students-container">
        <table id="students-table" class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Roll No</th>
              <th>Class</th>
              <th>Section</th>
              <th>Parent Contact</th>
              <th>Parent Email</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/scripts/navbar-admin.js"></script>
  <script src="../scripts/admin-view-students.js"></script>
</body>
</html>
