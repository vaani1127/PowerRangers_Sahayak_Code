<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sahayak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/scripts/theme.js"></script>
</head>
<body class="app-page">
  <script src="/scripts/loader.js"></script>

  <div class="app-layout">
    <div id="navbar-placeholder"></div>

    <main class="app-main">

      <div class="page-header-row">
        <div>
          <h1>Dashboard</h1>
          <p>Welcome back, <strong id="teacher-name">Teacher</strong></p>
        </div>
      </div>

      <!-- Stats (populated by JS) -->
      <div class="stat-grid" id="stats-row">
        <div class="stat-card">
          <div class="stat-icon si-purple">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </div>
          <div class="stat-value" id="stat-classes">-</div>
          <div class="stat-label">Assigned Classes</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon si-green">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="stat-value" id="stat-done">-</div>
          <div class="stat-label">Chapters Done</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon si-amber">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-value" id="stat-total">-</div>
          <div class="stat-label">Total Chapters</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon si-blue">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          </div>
          <div class="stat-value" id="stat-pending">-</div>
          <div class="stat-label">Pending Chapters</div>
        </div>
      </div>

      <!-- Class Teacher section -->
      <section id="class-teacher-section" style="display:none;" class="section-block">
        <div class="section-heading green">Class Teacher</div>
        <div id="class-teacher-actions-container"></div>
      </section>

      <!-- AI Content Card -->
      <div class="section-block">
        <div class="section-heading amber">AI Tools</div>
        <div class="action-card" onclick="window.location.href='content-generation.html'" style="max-width:340px;">
          <div class="action-card-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
          </div>
          <div>
            <div class="action-card-title">Content Generator</div>
            <div class="action-card-desc">Upload a PDF and generate summaries, questions, or MCQs with AI.</div>
          </div>
        </div>
      </div>

      <!-- Syllabus Trackers -->
      <div class="section-block">
        <div class="section-heading blue">Syllabus Progress</div>
        <div id="tracker-list-container"></div>
      </div>

      <!-- Submission Review -->
      <section id="submission-review-section" class="section-block">
        <div class="section-heading">Review Worksheet Submissions</div>
        <div id="submission-review-list-container"></div>
      </section>

    </main>
  </div>

  <script src="/scripts/theme.js"></script>
  <script src="../scripts/auth-check.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script src="../scripts/teacher-dashboard.js"></script>
</body>
</html>
